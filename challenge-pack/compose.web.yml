services:
  yit-web-1:
    build: ./web
    environment: [CHALLENGE=w1]
    ports: ["${WEB_BIND:-127.0.0.1}:8101:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
